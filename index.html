const DB = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem(k),
};

function uuid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

/* --- Auth mock --- */
const Auth = {
  register(email, password) {
    const users = DB.get('users') || {};
    if (users[email]) throw new Error('Email already registered.');
    const id = uuid();
    users[email] = { id, email, password, created_at: new Date().toISOString() };
    DB.set('users', users);
    // create default profile
    const profiles = DB.get('profiles') || {};
    profiles[id] = { id: uuid(), user_id: id, major: '', interests: [], skills: [], experience_level: 'entry', savings: 0, updated_at: new Date().toISOString() };
    DB.set('profiles', profiles);
    DB.set('loans_' + id, []);
    return { access_token: 'tok_' + id, refresh_token: 'ref_' + id, token_type: 'bearer', _uid: id };
  },
  login(email, password) {
    const users = DB.get('users') || {};
    const u = users[email];
    if (!u || u.password !== password) throw new Error('Invalid credentials.');
    return { access_token: 'tok_' + u.id, refresh_token: 'ref_' + u.id, token_type: 'bearer', _uid: u.id };
  },
  uidFromToken(tok) {
    if (!tok || !tok.startsWith('tok_')) return null;
    return tok.slice(4);
  },
};

/* --- Profile mock --- */
const ProfileAPI = {
  get(uid) { const p = DB.get('profiles') || {}; return p[uid] || null; },
  put(uid, patch) {
    const p = DB.get('profiles') || {};
    const cur = p[uid] || {};
    p[uid] = { ...cur, ...patch, user_id: uid, updated_at: new Date().toISOString() };
    DB.set('profiles', p);
    return p[uid];
  },
};

/* --- Loans mock --- */
const LoansAPI = {
  list(uid) { return DB.get('loans_' + uid) || []; },
  create(uid, data) {
    const loans = LoansAPI.list(uid);
    const loan = { ...data, id: uuid(), user_id: uid, created_at: new Date().toISOString() };
    loans.push(loan);
    DB.set('loans_' + uid, loans);
    return loan;
  },
  update(uid, id, data) {
    const loans = LoansAPI.list(uid);
    const idx = loans.findIndex(l => l.id === id);
    if (idx === -1) throw new Error('Loan not found');
    loans[idx] = { ...loans[idx], ...data };
    DB.set('loans_' + uid, loans);
    return loans[idx];
  },
  delete(uid, id) {
    const loans = LoansAPI.list(uid).filter(l => l.id !== id);
    DB.set('loans_' + uid, loans);
  },
};

/* --- Debt projection (real math) --- */
function computeTakeHome(annualSalary) {
  // FICA 7.65%
  const fica = Math.min(annualSalary, 168600) * 0.062 + annualSalary * 0.0145;
  // 2024 brackets (standard deduction $14,600 already applied to taxable)
  const taxable = Math.max(0, annualSalary - 14600);
  let tax = 0;
  const brackets = [[11600,0.10],[35550,0.12],[53375,0.22],[91425,0.24],[51775,0.32],[365625,0.35],[Infinity,0.37]];
  let rem = taxable;
  for (const [size, rate] of brackets) {
    if (rem <= 0) break;
    const chunk = Math.min(rem, size);
    tax += chunk * rate;
    rem -= chunk;
  }
  return (annualSalary - fica - tax) / 12;
}

function avalanche(loans, monthlyPayment) {
  // deep copy
  let lns = loans.map(l => ({ ...l, balance: +l.balance, rate: +l.annual_interest_rate, minPay: +l.minimum_monthly_payment }));
  let months = 0, totalInterest = 0;
  while (lns.some(l => l.balance > 0) && months < 600) {
    months++;
    // accrue interest + min payments
    let surplus = monthlyPayment;
    lns = lns.map(l => {
      if (l.balance <= 0) return l;
      const interest = l.balance * (l.rate / 12);
      totalInterest += interest;
      l.balance += interest;
      const pay = Math.min(l.balance, l.minPay);
      l.balance -= pay;
      surplus -= pay;
      return l;
    });
    surplus = Math.max(0, surplus);
    // avalanche: pay highest-rate first
    lns = [...lns].sort((a, b) => b.rate - a.rate);
    for (let i = 0; i < lns.length && surplus > 0; i++) {
      if (lns[i].balance <= 0) continue;
      const pay = Math.min(lns[i].balance, surplus);
      lns[i].balance -= pay;
      surplus -= pay;
    }
    // balance can't go negative
    lns = lns.map(l => ({ ...l, balance: Math.max(0, l.balance) }));
  }
  return { months, totalInterest };
}

function generateMockJobs(profile) {
  const sources = ['linkedin','handshake','indeed','usajobs'];
  const titles = ['Software Engineer','Data Analyst','Product Manager','UX Designer','Backend Developer','Frontend Developer','ML Engineer','DevOps Engineer','Business Analyst','Systems Engineer'];
  const companies = ['Acme Corp','TechCo','DataSoft','BuildIt Inc','CloudBase','Nexus LLC','InnovateCo','BrightPath','CoreSystems','StackWorks'];
  const locations = ['New York, NY','San Francisco, CA','Austin, TX','Chicago, IL','Remote','Seattle, WA','Boston, MA','Denver, CO'];
  const jobs = [];
  for (let i = 0; i < 12; i++) {
    const fitScore = Math.floor(Math.random() * 100);
    const tier = fitScore >= 70 ? 'high' : fitScore >= 40 ? 'mid' : 'low';
    const salMin = Math.round((55000 + Math.random() * 80000) / 1000) * 1000;
    const salMax = salMin + Math.round((10000 + Math.random() * 30000) / 1000) * 1000;
    jobs.push({
      id: uuid(),
      job_title: titles[i % titles.length],
      company: companies[i % companies.length],
      location: locations[i % locations.length],
      salary_min: salMin,
      salary_max: salMax,
      salary_median_est: Math.round((salMin + salMax) / 2),
      source: sources[i % sources.length],
      job_url: '#',
      fit_score: fitScore,
      tier,
    });
  }
  return jobs;
}

const ResultsAPI = {
  generate(uid, savingsRate) {
    const profile = ProfileAPI.get(uid);
    const loans = LoansAPI.list(uid);
    const jobs = generateMockJobs(profile);
    const tiers = ['high','mid','low'];
    const medians = { high: 95000, mid: 72000, low: 52000 };
    const result = { created_at: new Date().toISOString() };
    for (const t of tiers) {
      const tierJobs = jobs.filter(j => j.tier === t);
      const salaries = tierJobs.map(j => j.salary_median_est || ((j.salary_min||0) + (j.salary_max||0)) / 2).filter(Boolean);
      const salMin = salaries.length ? Math.min(...salaries) : medians[t] * 0.85;
      const salMax = salaries.length ? Math.max(...salaries) : medians[t] * 1.15;
      const median = medians[t];
      const takeHome = computeTakeHome(median);
      const monthlyPayment = takeHome * (savingsRate / 100);
      const { months, totalInterest } = loans.length
        ? avalanche(loans, monthlyPayment)
        : { months: 0, totalInterest: 0 };
      result[t + '_tier'] = {
        jobs: tierJobs,
        salary_stats: { min: salMin, max: salMax, median },
        debt_projection: { months_to_payoff: months, total_interest_paid: Math.round(totalInterest), median_salary_used: median, savings_rate_pct: savingsRate },
      };
    }
    DB.set('results_' + uid, result);
    return result;
  },
  latest(uid) {
    return DB.get('results_' + uid) || null;
  },
};

const AuthCtx = createContext(null);

    setToken(tokens.access_token);

    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    setToken(null);
  }
  return React.createElement(AuthCtx.Provider, { value: { token, uid, isAuthenticated: !!uid, login: doLogin, logout: doLogout } }, children);
}

  useEffect(() => {
    const handler = () => setPath(window.location.pathname);
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, []);

}

// ── TagInput ───────────────────────────────────
function TagInput({ tags, onChange, placeholder }) {
  const [input, setInput] = useState('');
  function addTag(raw) {
    const val = raw.trim().replace(/,$/, '').trim();
    if (val && !tags.includes(val)) onChange([...tags, val]);
    setInput('');
  }
  function handleKey(e) {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(input); }
    else if (e.key === 'Backspace' && input === '' && tags.length > 0) onChange(tags.slice(0, -1));
  }
  return React.createElement('div', { className: 'flex flex-wrap gap-1.5 items-center border border-gray-300 rounded-md px-2 py-1.5 bg-white focus-within:ring-2 focus-within:ring-blue-500' },
    ...tags.map(tag =>
      React.createElement('span', { key: tag, className: 'inline-flex items-center gap-1 bg-gray-100 text-gray-700 text-sm px-2 py-0.5 rounded-full' },
        tag,
        React.createElement('button', { type: 'button', onClick: () => onChange(tags.filter(t => t !== tag)), className: 'text-gray-400 hover:text-gray-600' }, '×')
      )
    ),
    React.createElement('input', {
      type: 'text', value: input,
      onChange: e => setInput(e.target.value),
      onKeyDown: handleKey,
      onBlur: () => addTag(input),
      placeholder: tags.length === 0 ? (placeholder || 'Add…') : '',
      className: 'flex-1 min-w-28 outline-none text-sm bg-transparent placeholder-gray-400',
    })
  );
}

function formatMonths(m) {

  if (m < 12) return `${m} mo`;

}
function TierCard({ label, projection, speedRank }) {

}

}

          React.createElement(TagInput, { tags: profile.skills, onChange: tags => updateField('skills', tags), placeholder: 'Add skill and press Enter…' }),
          React.createElement('p', { className: 'text-xs text-gray-400 mt-1' }, 'Press Enter or comma to add each skill.')
        ),
        React.createElement('div', null,
          React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Experience Level'),
          React.createElement('select', { value: profile.experience_level, onChange: e => updateField('experience_level', e.target.value), className: inputCls },
            React.createElement('option', { value: 'entry' }, 'Entry Level'),
            React.createElement('option', { value: 'mid' }, 'Mid Level'),
            React.createElement('option', { value: 'senior' }, 'Senior Level')
          )
        ),
        React.createElement('div', null,
          React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Current Savings'),
          React.createElement('div', { className: 'relative' },
            React.createElement('span', { className: 'absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm' }, '$'),
            React.createElement('input', { type: 'number', min: 0, step: 100, value: profile.savings, onChange: e => updateField('savings', parseFloat(e.target.value)||0), className: 'w-full border border-gray-300 rounded-md pl-7 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500' })
          )
        )
      ),

      // Resume
      React.createElement('section', { className: 'bg-white rounded-xl border border-gray-200 p-6 space-y-3' },
        React.createElement('div', null,
          React.createElement('h2', { className: 'text-base font-semibold text-gray-800' }, 'Your Resume'),
          React.createElement('p', { className: 'text-sm text-gray-500 mt-0.5' }, 'Optional — uploading your resume improves job match quality.')
        ),
        React.createElement(ResumeUpload, { onExtracted: setResumeText })
      ),

      // Student Loans
      React.createElement('section', { className: 'bg-white rounded-xl border border-gray-200 p-6 space-y-4' },
        React.createElement('div', null,
          React.createElement('h2', { className: 'text-base font-semibold text-gray-800' }, 'Your Student Loans'),
          React.createElement('p', { className: 'text-sm text-gray-500 mt-0.5' }, 'Add each loan to calculate your payoff timeline across salary tiers.')
        ),
        React.createElement(LoanList, { loans, onAdd: handleAddLoan, onUpdate: handleUpdateLoan, onDelete: handleDeleteLoan })
      ),

      // Generate
      genError && React.createElement('p', { className: 'text-sm text-red-600 text-center' }, genError),
      React.createElement('button', {
        onClick: handleGenerate,

      },

}

// ── Results Page ─────────────────────────────
function ResultsPage() {
  const { uid } = useAuth();
  const { navigate } = useNav();
  const [results, setResults] = useState(null);
  const [isLoading, setIsLoading] = useState(true);
  const [error, setError] = useState(null);
  const [savingsRate, setSavingsRate] = useState(20);
  const [isRegenerating, setIsRegenerating] = useState(false);
  const debounceRef = useRef(null);

  useEffect(() => {
    const r = ResultsAPI.latest(uid);
    if (!r) { navigate('/profile'); return; }
    setResults(r);
    setIsLoading(false);
  }, [uid]);

  const isFirstRender = useRef(true);
  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => handleRegenerate(savingsRate), 1000);
    return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
  }, [savingsRate]);

  function handleRegenerate(rate = savingsRate) {
    setIsRegenerating(true); setError(null);
    try {
      const data = ResultsAPI.generate(uid, rate);
      setResults(data);
    } catch {
      setError('Failed to regenerate results.');
    } finally {
      setIsRegenerating(false);
    }
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  const roughMonthlyTakeHome = results ? (results.high_tier.debt_projection.median_salary_used / 12) * 0.75 : 4000;

  if (isLoading) return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
    React.createElement(Navbar),
    React.createElement('div', { className: 'flex items-center justify-center py-32' },
      React.createElement('div', { className: 'flex items-center gap-3 text-gray-500' }, React.createElement(Spinner, { size: 5 }), 'Loading your results…')
    )
  );

  return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
    React.createElement(Navbar),
    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8' },

      // Header
      React.createElement('div', { className: 'flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3' },
        React.createElement('div', null,
          React.createElement('h1', { className: 'text-2xl font-bold text-gray-900' }, 'Your Career Matches'),
          results && React.createElement('p', { className: 'text-sm text-gray-500 mt-0.5' }, `Generated ${formatDate(results.created_at)}`)
        ),
        React.createElement('button', {
          onClick: () => handleRegenerate(),
          disabled: isRegenerating,
          className: 'inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 disabled:opacity-60',
        },
          isRegenerating && React.createElement(Spinner),
          'Regenerate →'
        )
      ),

      isRegenerating && React.createElement('div', { className: 'flex items-center gap-3 bg-blue-50 border border-blue-200 rounded-xl px-5 py-3 text-blue-700 text-sm font-medium' },
        React.createElement(Spinner),
        'Searching for jobs…'
      ),

      error && React.createElement('div', { className: 'bg-red-50 border border-red-200 rounded-xl px-5 py-3 text-red-700 text-sm' }, error),

      results && React.createElement(React.Fragment, null,
        React.createElement(SavingsRateSlider, { value: savingsRate, onChange: setSavingsRate, monthlyTakeHome: roughMonthlyTakeHome }),
        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
          React.createElement(TierColumn, { tier: results.high_tier, color: 'green', label: 'High Fit' }),
          React.createElement(TierColumn, { tier: results.mid_tier, color: 'amber', label: 'Mid Fit' }),
          React.createElement(TierColumn, { tier: results.low_tier, color: 'red', label: 'Low Fit' })
        ),
        React.createElement('section', { className: 'space-y-4' },
          React.createElement('h2', { className: 'text-lg font-bold text-gray-900' }, 'Student Loan Payoff Projection'),
          React.createElement(LoanProjectionComparison, { high: results.high_tier.debt_projection, mid: results.mid_tier.debt_projection, low: results.low_tier.debt_projection }),
          React.createElement(PayoffChart, { high: results.high_tier.debt_projection, mid: results.mid_tier.debt_projection, low: results.low_tier.debt_projection })
        ),
        React.createElement('section', null,
          React.createElement('details', { className: 'bg-white rounded-xl border border-gray-200' },
            React.createElement('summary', { className: 'px-5 py-3 text-sm font-semibold text-gray-700 cursor-pointer select-none list-none flex items-center justify-between' },
              'Saved Results History',
              React.createElement('span', { className: 'text-gray-400 text-xs' }, '▾')
            ),
            React.createElement('div', { className: 'px-5 pb-4 pt-2 border-t border-gray-100' },
              React.createElement('p', { className: 'text-xs text-gray-500' },
                'Latest snapshot generated on ',
                React.createElement('span', { className: 'font-medium text-gray-700' }, formatDate(results.created_at))
              )
            )
          )
        )
      )
    )
  );
}

// ─────────────────────────────────────────────
//  APP SHELL
// ─────────────────────────────────────────────
function ProtectedRoute({ children }) {
  const { isAuthenticated } = useAuth();
  const { navigate } = useNav();
  if (!isAuthenticated) { navigate('/login'); return null; }
  return children;
}

function AppRoutes() {
  const { path } = useNav();
  if (path === '/' || path === '') return React.createElement(HomePage);
  if (path === '/login') return React.createElement(LoginPage);
  if (path === '/register') return React.createElement(RegisterPage);
  if (path === '/profile') return React.createElement(ProtectedRoute, null, React.createElement(ProfilePage));
  if (path === '/results') return React.createElement(ProtectedRoute, null, React.createElement(ResultsPage));
  return React.createElement(HomePage);
}

function App() {
  return React.createElement(Router, null,
    React.createElement(AuthProvider, null,
      React.createElement(AppRoutes)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
